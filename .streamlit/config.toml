[client]
# 개발자용 메뉴(배포·캐시 지우기 등)를 숨겨 업무 화면만 보이게 한다
toolbarMode = "minimal"

[theme]
# 라이트 모드 고정: 디자인 시스템이 라이트 기준이다
base = "light"

# 표면
backgroundColor = "#F5F5F7"           # 앱 배경: 따뜻한 라이트 그레이
secondaryBackgroundColor = "#F8F8FA"  # 입력창 등 위젯 배경
textColor = "#1C1C1E"                 # 기본 텍스트: 차콜
borderColor = "#E5E5EA"               # 가벼운 테두리

# 주요 버튼과 링크
primaryColor = "#636366"              # 차콜 그레이 (흰 글씨 대비 확보)
linkColor = "#6E6A8E"                 # 절제된 라벤더 그레이

# 상태 배지용 색 (:violet / :gray 배지)
violetColor = "#7D78A0"
violetBackgroundColor = "#EEEDF5"
violetTextColor = "#5E5A7E"
grayColor = "#8E8E93"
grayBackgroundColor = "#EFEFF1"
grayTextColor = "#636366"

# 타이포그래피: Apple → Windows → 한국어 시스템 폰트 순서
font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"
baseFontSize = 15
headingFontSizes = ["28px", "22px", "18px", "16px", "14px", "13px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]

# 모서리와 여백
baseRadius = "16px"
buttonRadius = "14px"
paddingTop = "2rem"
paddingBottom = "4rem"
